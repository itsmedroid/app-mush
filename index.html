<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grzybobranie 🍄</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#111;color:#fff;height:100dvh;overflow:hidden;touch-action:manipulation}
#map{width:100%;height:100dvh}

/* PRZYCISKI GŁÓWNE */
#btn-jest{position:fixed;bottom:116px;left:50%;transform:translateX(-50%);z-index:900;width:96px;height:96px;border-radius:50%;background:#2d7a2d;border:3px solid #4aaa4a;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 24px rgba(45,122,45,0.55);-webkit-tap-highlight-color:transparent;letter-spacing:.5px}
#btn-jest .bi{font-size:30px;line-height:1}
#btn-jest:active{transform:translateX(-50%) scale(0.91)}
#mic-btn{position:fixed;bottom:116px;right:14px;z-index:900;width:56px;height:56px;border-radius:50%;background:#1c1c1c;border:1px solid #3a3a3a;color:#aaa;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
#mic-btn.on{background:#6a1212;border-color:#cc2222;color:#ff6666}
#list-btn{position:fixed;bottom:116px;left:14px;z-index:900;width:56px;height:56px;border-radius:50%;background:#1c1c1c;border:1px solid #3a3a3a;color:#aaa;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#export-btn{position:fixed;bottom:50px;right:14px;z-index:900;background:rgba(20,20,20,.9);border:1px solid #3a3a3a;color:#aaa;padding:8px 13px;border-radius:18px;font-size:12px;cursor:pointer}
#mic-dot{position:fixed;bottom:180px;right:28px;z-index:900;width:11px;height:11px;border-radius:50%;background:#333;transition:background .3s;pointer-events:none}
#mic-dot.on{background:#44dd44;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* GPS + SUMMARY */
#top-bar{position:fixed;top:0;left:0;right:0;z-index:900;display:flex;flex-direction:column;gap:0}
#gps-row{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;background:rgba(10,10,10,.82)}
#gps-dot{width:9px;height:9px;border-radius:50%;background:#555;flex-shrink:0}
#gps-dot.ok{background:#44dd44}
#gps-dot.warn{background:#ddaa22}
#gps-dot.bad{background:#dd3333}
#gps-txt{font-size:12px;color:#888;flex:1}
#filter-btn{font-size:11px;color:#888;background:transparent;border:1px solid #333;border-radius:12px;padding:4px 10px;cursor:pointer}
#summary{display:none;padding:4px 12px 8px;background:rgba(10,10,10,.82);flex-wrap:wrap;gap:6px}
#summary.show{display:flex}
.sum-chip{background:#1e3a1e;border:1px solid #2d5a2d;border-radius:14px;padding:4px 11px;font-size:12px;color:#8dcf8d;cursor:pointer;white-space:nowrap}
.sum-chip.active{background:#2d7a2d;color:#fff;border-color:#4aaa4a}

/* TOAST */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3000;background:rgba(0,0,0,.9);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
#toast.show{opacity:1}

/* PANEL LISTA */
#panel{position:fixed;bottom:0;left:0;right:0;z-index:2000;background:#161616;border-top:1px solid #2a2a2a;border-radius:16px 16px 0 0;max-height:0;overflow:hidden;transition:max-height .3s}
#panel.open{max-height:65dvh}
#panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;position:sticky;top:0;background:#161616;border-bottom:1px solid #222}
#panel-title{color:#999;font-size:13px}
#panel-close{color:#555;font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
#panel-list{overflow-y:auto;max-height:calc(65dvh - 48px);padding:0 14px 80px}
.pt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1e1e1e;cursor:pointer}
.pt:last-child{border:none}
.pt-icon{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.pt-info{flex:1;min-width:0}
.pt-name{color:#ccc;font-size:13px;font-weight:500}
.pt-meta{color:#555;font-size:11px;margin-top:1px}
.pt-del{color:#553333;font-size:18px;padding:4px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pt-del:active{color:#cc3333}

/* SZUKAJ / AUTOCOMPLETE */
#search-wrap{position:fixed;bottom:186px;left:50%;transform:translateX(-50%);z-index:2500;width:82%;display:none}
#search-wrap.open{display:block}
#search-input{width:100%;background:#1e1e1e;border:1px solid #4aaa4a;border-radius:12px;color:#fff;padding:11px 16px;font-size:15px;outline:none}
#autocomplete{background:#1a1a1a;border:1px solid #333;border-radius:0 0 12px 12px;max-height:180px;overflow-y:auto;display:none}
#autocomplete.show{display:block}
.ac-item{padding:10px 16px;font-size:14px;color:#ccc;cursor:pointer;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px}
.ac-item:last-child{border:none}
.ac-item:active{background:#252525}
.ac-icon{font-size:18px;width:24px;text-align:center}

/* MODAL SZCZEGÓŁY */
#modal{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.7);display:none;align-items:flex-end}
#modal.open{display:flex}
#modal-box{background:#181818;border-top:1px solid #333;border-radius:16px 16px 0 0;width:100%;padding:20px 18px 36px}
#modal-box h3{color:#ccc;font-size:15px;font-weight:500;margin-bottom:14px}
.m-inp{width:100%;background:#232323;border:1px solid #3a3a3a;border-radius:8px;color:#ddd;padding:12px;font-size:16px;margin-bottom:10px;outline:none}
.m-inp:focus{border-color:#4aaa4a}
.modal-row{display:flex;gap:8px;margin-top:4px}
.modal-row button{flex:1;padding:13px;border-radius:8px;font-size:15px;cursor:pointer}
#m-cancel{background:transparent;border:1px solid #3a3a3a;color:#888}
#m-save{background:#2d7a2d;border:none;color:#fff;font-weight:600}

/* POPUP MARKERA */
.leaflet-popup-content-wrapper{background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#ccc;box-shadow:0 4px 16px rgba(0,0,0,.6)}
.leaflet-popup-tip{background:#1a1a1a}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.6}
.popup-name{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}
.popup-del{display:block;margin-top:10px;padding:7px 0;background:#3a1010;border:1px solid #662222;border-radius:6px;color:#cc4444;text-align:center;cursor:pointer;font-size:13px;width:100%}
.popup-del:active{background:#551515}
</style>
</head>
<body>

<div id="map"></div>

<div id="top-bar">
  <div id="gps-row">
    <div id="gps-dot"></div>
    <span id="gps-txt">GPS: inicjalizacja...</span>
    <button id="filter-btn" onclick="toggleFilter()">🔍 filtr</button>
  </div>
  <div id="summary"></div>
</div>

<div id="toast"></div>
<div id="mic-dot"></div>

<div id="search-wrap">
  <input id="search-input" placeholder="Szukaj gatunku..." autocomplete="off" />
  <div id="autocomplete"></div>
</div>

<button id="list-btn" onclick="togglePanel()">📋</button>
<button id="btn-jest">
  <span class="bi">🍄</span>
  <span>JEST!</span>
</button>
<button id="mic-btn" onclick="toggleMic()">🎙️</button>
<button id="export-btn" onclick="exportGPX()">⬇ GPX</button>

<div id="panel">
  <div id="panel-head">
    <span id="panel-title">Lista</span>
    <span id="panel-close" onclick="togglePanel()">✕</span>
  </div>
  <div id="panel-list"></div>
</div>

<div id="modal">
  <div id="modal-box">
    <h3>Dodaj szczegóły</h3>
    <input id="m-species" class="m-inp" placeholder="Gatunek (np. podgrzybek)" autocomplete="off"/>
    <input id="m-count" class="m-inp" type="number" placeholder="Liczba sztuk" min="1" value="1"/>
    <div class="modal-row">
      <button id="m-cancel" onclick="closeModal()">Anuluj</button>
      <button id="m-save" onclick="saveFromModal()">Zapisz</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══════════════════════════════════════
// BAZA GRZYBÓW
// ═══════════════════════════════════════
var GRZYBY = [
  {name:'borowik szlachetny', aliases:['prawdziwek','borowik'], icon:'🟤', color:'#8B4513'},
  {name:'podgrzybek brunatny', aliases:['podgrzybek'], icon:'🍄', color:'#6B3410'},
  {name:'pieprznik jadalny',   aliases:['kurka','kurki','lisiczka'], icon:'🟡', color:'#FFA500'},
  {name:'maślak zwyczajny',    aliases:['maślak','maślaki'], icon:'🟠', color:'#CC7722'},
  {name:'koźlarz babka',       aliases:['kozak','kozaki','koźlarz'], icon:'🔴', color:'#8B0000'},
  {name:'rydz',                aliases:['rydze'], icon:'🟠', color:'#FF6600'},
  {name:'gąska zielonka',      aliases:['gąska','zielonka'], icon:'🟢', color:'#556B2F'},
  {name:'czubajka kania',      aliases:['kania','kanie'], icon:'⚪', color:'#C8A97E'},
  {name:'opieńka miodowa',     aliases:['opieńka','opienka','opieńki'], icon:'🟡', color:'#DAA520'},
  {name:'pieczarka polna',     aliases:['pieczarka'], icon:'⚪', color:'#F5F5F5'},
  {name:'boczniak ostrygowaty',aliases:['boczniak'], icon:'🩶', color:'#708090'},
  {name:'smardzowate',         aliases:['smardz','smardzak'], icon:'🟤', color:'#5C4033'},
  {name:'purchawka olbrzymia', aliases:['purchawka'], icon:'⚪', color:'#E8E8E8'},
  {name:'łysiczka lancetowata',aliases:['łysiczka'], icon:'🟤', color:'#704214'},
  {name:'mleczaj rydz',        aliases:['mleczaj'], icon:'🟠', color:'#FF8C00'},
  {name:'gołąbek zielonawy',   aliases:['gołąbek','gołąbki'], icon:'🟢', color:'#3A7D44'},
  {name:'podgrzybek złotawy',  aliases:['złotawy'], icon:'🟡', color:'#B8860B'},
  {name:'żurawka',             aliases:['żurawka'], icon:'🟤', color:'#7B5835'},
  {name:'trąbka śmierci',      aliases:['trąbka'], icon:'⚫', color:'#333333'},
  {name:'korek',               aliases:['korek'], icon:'🔵', color:'#4682B4'},
  {name:'lejkówka',            aliases:['lejkówka'], icon:'⚪', color:'#D2B48C'},
  {name:'twardzioszek przydrożny', aliases:['twardzioszek'], icon:'🟤', color:'#8B7355'},
  {name:'huba',                aliases:['huba','huby'], icon:'🟤', color:'#6B4226'},
  {name:'sarniak dachówkowaty',aliases:['sarniak'], icon:'🟡', color:'#C8B400'},
  {name:'podgrzybek zaróżowiony', aliases:['różowy'], icon:'🔴', color:'#C06080'},
];

var DEFAULT = {name:'nieznany', icon:'🍄', color:'#2d7a2d'};

function findGrzyb(text) {
  if (!text) return null;
  text = text.toLowerCase().trim();
  for (var i=0; i<GRZYBY.length; i++) {
    var g = GRZYBY[i];
    if (g.name.toLowerCase() === text) return g;
    for (var j=0; j<g.aliases.length; j++) {
      if (g.aliases[j].toLowerCase() === text) return g;
    }
  }
  // częściowe dopasowanie
  for (var i=0; i<GRZYBY.length; i++) {
    var g = GRZYBY[i];
    if (g.name.toLowerCase().includes(text)) return g;
    for (var j=0; j<g.aliases.length; j++) {
      if (g.aliases[j].toLowerCase().includes(text)) return g;
    }
  }
  return null;
}

function searchGrzyby(text) {
  if (!text || text.length < 2) return [];
  text = text.toLowerCase();
  var results = [];
  for (var i=0; i<GRZYBY.length; i++) {
    var g = GRZYBY[i];
    var match = g.name.toLowerCase().includes(text);
    if (!match) {
      for (var j=0; j<g.aliases.length; j++) {
        if (g.aliases[j].toLowerCase().includes(text)) { match=true; break; }
      }
    }
    if (match) results.push(g);
  }
  return results.slice(0,8);
}

// ═══════════════════════════════════════
// STAN
// ═══════════════════════════════════════
var points = JSON.parse(localStorage.getItem('grzybobranie_points') || '[]');
var markers = {}; // id -> leaflet marker
var map, userMarker, userPos = null;
var micActive = false, recog = null;
var holdTimer = null, holdFired = false;
var activeFilter = null; // null = pokaż wszystkie

// ═══════════════════════════════════════
// MAPA
// ═══════════════════════════════════════
map = L.map('map', {zoomControl:false, attributionControl:true}).setView([50.05, 19.95], 13);

var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'});
var offlineLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'});

osmLayer.addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

// cache kafelków offline
if ('serviceWorker' in navigator) {
  // prosty SW inline przez blob
  var swCode = 'self.addEventListener("fetch",function(e){if(e.request.url.includes("tile.openstreetmap")){e.respondWith(caches.open("tiles").then(function(c){return c.match(e.request).then(function(r){return r||(fetch(e.request).then(function(res){c.put(e.request,res.clone());return res}))})}))}})';
  var blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}

// ═══════════════════════════════════════
// GPS
// ═══════════════════════════════════════
function startGPS() {
  if (!navigator.geolocation) { toast('GPS niedostępny'); return; }
  navigator.geolocation.watchPosition(function(pos) {
    userPos = pos;
    var lat=pos.coords.latitude, lng=pos.coords.longitude, acc=Math.round(pos.coords.accuracy);
    var dot = document.getElementById('gps-dot');
    document.getElementById('gps-txt').textContent = 'GPS: ±'+acc+'m';
    dot.className = acc<20?'ok':acc<60?'warn':'bad';
    if (!userMarker) {
      map.setView([lat,lng], 16);
      userMarker = L.circleMarker([lat,lng], {radius:9,fillColor:'#4af',color:'#fff',weight:2.5,fillOpacity:1}).addTo(map);
    } else {
      userMarker.setLatLng([lat,lng]);
    }
  }, function() {
    document.getElementById('gps-dot').className = 'bad';
    document.getElementById('gps-txt').textContent = 'GPS: brak dostępu';
    toast('Włącz lokalizację i odśwież stronę');
  }, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
}
startGPS();

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
var toastT;
function toast(msg, dur) {
  dur = dur||2600;
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('show'); }, dur);
}

// ═══════════════════════════════════════
// ZAPIS PUNKTU
// ═══════════════════════════════════════
function savePoint(speciesText, count) {
  count = count || 1;
  if (!userPos) { toast('⚠️ Brak GPS — czekaj chwilę lub włącz lokalizację'); return; }
  var grzyb = speciesText ? (findGrzyb(speciesText) || {name: speciesText, icon:'🍄', color:'#2d7a2d'}) : DEFAULT;
  var lat=userPos.coords.latitude, lng=userPos.coords.longitude, acc=Math.round(userPos.coords.accuracy);
  var now = new Date();
  var time = now.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  var pt = {id:Date.now(), lat:lat, lng:lng, acc:acc, time:time, ts:now.toISOString(),
            species:grzyb.name, icon:grzyb.icon, color:grzyb.color, count:count};
  points.push(pt);
  saveStorage();
  addMarker(pt);
  updateSummary();
  var label = pt.species==='nieznany'?'Grzyb':pt.species;
  var msg = pt.icon+' '+label+(count>1?' ×'+count:'');
  msg += ' · ±'+acc+'m';
  if (acc>40) msg += ' ⚠️';
  toast(msg);
}

function addMarker(pt) {
  var icon = L.divIcon({
    html: '<div style="font-size:22px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.8));line-height:1">'+pt.icon+'</div>',
    className:'', iconSize:[26,26], iconAnchor:[13,13]
  });
  var m = L.marker([pt.lat, pt.lng], {icon:icon}).addTo(map);
  var label = pt.species==='nieznany'?'Grzyb':pt.species;
  m.bindPopup(
    '<div class="popup-name">'+pt.icon+' '+label+(pt.count>1?' ×'+pt.count:'')+'</div>'+
    '<div>'+pt.time+' · ±'+pt.acc+'m</div>'+
    '<button class="popup-del" onclick="deletePoint('+pt.id+')">🗑 Usuń ten punkt</button>'
  );
  markers[pt.id] = m;
}

// ═══════════════════════════════════════
// USUWANIE
// ═══════════════════════════════════════
function deletePoint(id) {
  if (!confirm('Usunąć ten punkt?')) return;
  points = points.filter(function(p){ return p.id !== id; });
  saveStorage();
  if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
  updateSummary();
  renderList();
  map.closePopup();
  toast('Punkt usunięty');
}

// ═══════════════════════════════════════
// FILTROWANIE
// ═══════════════════════════════════════
function toggleFilter() {
  var el = document.getElementById('summary');
  el.classList.toggle('show');
}

function setFilter(species) {
  activeFilter = (activeFilter === species) ? null : species;
  Object.values(markers).forEach(function(m){ map.removeLayer(m); });
  markers = {};
  var toShow = activeFilter ? points.filter(function(p){ return p.species===activeFilter; }) : points;
  toShow.forEach(function(p){ addMarker(p); });
  updateSummary();
}

function updateSummary() {
  var counts = {};
  points.forEach(function(p){
    counts[p.species] = (counts[p.species]||{count:0, icon:p.icon});
    counts[p.species].count += p.count;
    counts[p.species].icon = p.icon;
  });
  var sum = document.getElementById('summary');
  if (Object.keys(counts).length === 0) { sum.classList.remove('show'); sum.innerHTML=''; return; }
  sum.innerHTML = Object.keys(counts).map(function(s){
    var active = activeFilter===s ? ' active':'';
    var label = s==='nieznany'?'Grzyb':s;
    return '<span class="sum-chip'+active+'" onclick="setFilter(\''+s.replace(/'/g,"\\'")+'\')">'
      +counts[s].icon+' '+label+': '+counts[s].count+'</span>';
  }).join('');
  sum.classList.add('show');
  document.getElementById('panel-title').textContent = 'Lista ('+points.length+' punktów)';
}

// ═══════════════════════════════════════
// LISTA / PANEL
// ═══════════════════════════════════════
function togglePanel() {
  var p = document.getElementById('panel');
  p.classList.toggle('open');
  if (p.classList.contains('open')) renderList();
}

function renderList() {
  var el = document.getElementById('panel-list');
  var list = activeFilter ? points.filter(function(p){ return p.species===activeFilter; }) : points;
  if (list.length === 0) { el.innerHTML='<p style="color:#444;font-size:13px;padding:14px 0">Brak zapisanych punktów</p>'; return; }
  el.innerHTML = list.slice().reverse().map(function(p){
    var label = p.species==='nieznany'?'Grzyb':p.species;
    return '<div class="pt">'
      +'<div class="pt-icon" onclick="flyTo('+p.lat+','+p.lng+')">'+p.icon+'</div>'
      +'<div class="pt-info" onclick="flyTo('+p.lat+','+p.lng+')">'
        +'<div class="pt-name">'+label+(p.count>1?' ×'+p.count:'')+'</div>'
        +'<div class="pt-meta">'+p.time+' · ±'+p.acc+'m</div>'
      +'</div>'
      +'<span class="pt-del" onclick="deletePoint('+p.id+')">🗑</span>'
    +'</div>';
  }).join('');
}

function flyTo(lat,lng) {
  map.setView([lat,lng],17);
  document.getElementById('panel').classList.remove('open');
}

// ═══════════════════════════════════════
// PRZYCISK JEST (tap = zapis, przytrzymaj = szukaj)
// ═══════════════════════════════════════
var jestBtn = document.getElementById('btn-jest');
jestBtn.addEventListener('touchstart', function(e){
  e.preventDefault();
  holdFired = false;
  holdTimer = setTimeout(function(){ holdFired=true; openSearch(); }, 550);
},{passive:false});
jestBtn.addEventListener('touchend', function(e){
  e.preventDefault();
  clearTimeout(holdTimer);
  if (!holdFired) savePoint();
},{passive:false});
jestBtn.addEventListener('mousedown', function(){
  holdFired=false;
  holdTimer=setTimeout(function(){ holdFired=true; openSearch(); },550);
});
jestBtn.addEventListener('mouseup', function(){
  clearTimeout(holdTimer);
  if (!holdFired) savePoint();
});
jestBtn.addEventListener('mouseleave', function(){ clearTimeout(holdTimer); });

// ═══════════════════════════════════════
// WYSZUKIWARKA GATUNKÓW
// ═══════════════════════════════════════
var searchWrap = document.getElementById('search-wrap');
var searchInput = document.getElementById('search-input');
var acList = document.getElementById('autocomplete');

function openSearch() {
  searchInput.value = '';
  acList.innerHTML = '';
  acList.classList.remove('show');
  searchWrap.classList.add('open');
  setTimeout(function(){ searchInput.focus(); }, 100);
}

function closeSearch() {
  searchWrap.classList.remove('open');
  acList.classList.remove('show');
  searchInput.blur();
}

searchInput.addEventListener('input', function(){
  var q = this.value.trim();
  var results = searchGrzyby(q);
  if (results.length===0) { acList.classList.remove('show'); return; }
  acList.innerHTML = results.map(function(g){
    return '<div class="ac-item" onclick="selectGrzyb(\''+g.name.replace(/'/g,"\\'")+'\')"><span class="ac-icon">'+g.icon+'</span>'+g.name+'</div>';
  }).join('');
  acList.classList.add('show');
});

searchInput.addEventListener('keydown', function(e){
  if (e.key==='Enter') {
    var val = this.value.trim();
    if (val) { closeSearch(); openModal(val); }
    else closeSearch();
  }
  if (e.key==='Escape') closeSearch();
});

function selectGrzyb(name) {
  closeSearch();
  openModal(name);
}

// klik poza = zamknij
document.addEventListener('touchstart', function(e){
  if (searchWrap.classList.contains('open') && !searchWrap.contains(e.target) && e.target!==jestBtn)
    closeSearch();
},{passive:true});

// ═══════════════════════════════════════
// MODAL SZCZEGÓŁY
// ═══════════════════════════════════════
function openModal(speciesPrefill) {
  document.getElementById('m-species').value = speciesPrefill||'';
  document.getElementById('m-count').value = '1';
  document.getElementById('modal').classList.add('open');
  setTimeout(function(){
    var inp = document.getElementById(speciesPrefill?'m-count':'m-species');
    inp.focus();
  },150);
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function saveFromModal() {
  var s = document.getElementById('m-species').value.trim();
  var c = Math.max(1, parseInt(document.getElementById('m-count').value)||1);
  savePoint(s||null, c);
  closeModal();
}
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

// ═══════════════════════════════════════
// MIKROFON + PARSOWANIE GŁOSU
// ═══════════════════════════════════════
var LICZBY = {'jeden':1,'jedna':1,'dwa':2,'dwie':2,'trzy':3,'cztery':4,'pięć':5,'sześć':6,'siedem':7,'osiem':8,'dziewięć':9,'dziesięć':10,'jedenaście':11,'dwanaście':12,'trzynaście':13,'czternaście':14,'piętnaście':15,'dwadzieścia':20};

function parseVoice(text) {
  text = text.toLowerCase().trim();
  // prosty trigger
  if (/^(jest|mam|grzyb)$/.test(text)) return {species:null, count:1};

  var count = 1;
  var species = null;

  // wyciągnij liczbę (cyfry lub słownie)
  var numMatch = text.match(/(\d+)/);
  if (numMatch) {
    count = parseInt(numMatch[1]);
    text = text.replace(numMatch[0],'').trim();
  } else {
    for (var word in LICZBY) {
      if (text.includes(word)) {
        count = LICZBY[word];
        text = text.replace(word,'').trim();
        break;
      }
    }
  }

  // szukaj gatunku w pozostałym tekście
  var grzyb = findGrzyb(text);
  if (grzyb) species = grzyb.name;
  else if (text.length > 2) species = text; // custom

  return {species: species, count: count};
}

function initSpeech() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('mic-btn').style.opacity='.35'; return null; }
  var r = new SR();
  r.lang = 'pl-PL'; r.continuous = true; r.interimResults = false;
  r.onresult = function(e) {
    var t = e.results[e.results.length-1][0].transcript;
    var parsed = parseVoice(t);
    if (parsed) {
      toast('🎙 "'+t.trim()+'"', 1500);
      savePoint(parsed.species, parsed.count);
    }
  };
  r.onend = function(){ if(micActive) r.start(); };
  r.onerror = function(e){ if(e.error!=='no-speech') toast('Mikrofon: '+e.error); };
  return r;
}

function toggleMic() {
  if (!recog) recog = initSpeech();
  if (!recog) { toast('Mikrofon działa w Chrome (Android) i Safari (iOS)'); return; }
  micActive = !micActive;
  var btn = document.getElementById('mic-btn');
  var dot = document.getElementById('mic-dot');
  if (micActive) {
    recog.start();
    btn.classList.add('on'); dot.classList.add('on');
    toast('🎙 Słucham — powiedz "kurka 3" lub "kozak"');
  } else {
    recog.stop();
    btn.classList.remove('on'); dot.classList.remove('on');
    toast('Mikrofon wyłączony');
  }
}

// ═══════════════════════════════════════
// EKSPORT GPX
// ═══════════════════════════════════════
function exportGPX() {
  if (points.length===0) { toast('Brak punktów'); return; }
  var wpts = points.map(function(p){
    var name = (p.species==='nieznany'?'Grzyb':p.species)+(p.count>1?' x'+p.count:'');
    return '  <wpt lat="'+p.lat+'" lon="'+p.lng+'"><name>'+name+'</name><desc>'+p.time+' ±'+p.acc+'m</desc><time>'+p.ts+'</time></wpt>';
  }).join('\n');
  var gpx = '<?xml version="1.0"?>\n<gpx version="1.1" creator="Grzybobranie">\n'+wpts+'\n</gpx>';
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download = 'grzybobranie_'+new Date().toLocaleDateString('pl-PL').replace(/\./g,'-')+'.gpx';
  a.click();
  toast('GPX: '+points.length+' punktów');
}

function saveStorage() {
  try { localStorage.setItem('grzybobranie_points', JSON.stringify(points)); } catch(e){}
}
